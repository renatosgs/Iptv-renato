
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAX IPTV PLAYER</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:white;font-family:Arial}
header{padding:20px;background:#111c30;border-bottom:1px solid #263956}
.logo{font-size:25px;font-weight:bold;color:#00caff}
header small{color:#9baac0}
main{max-width:1100px;margin:auto;padding:15px}
.panel{background:#111c30;padding:16px;border-radius:12px;margin-bottom:16px}
h2{font-size:18px;margin:0 0 14px}
h3{font-size:15px}
input,button,select{width:100%;padding:13px;margin:5px 0;border-radius:8px;border:1px solid #34445f;background:#091321;color:white}
button{background:#087dff;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#263751}
button:disabled{opacity:.5}
.tabs,.categories{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.tabs button,.categories button{min-width:max-content;width:auto}
.tabs button.active,.categories button.active{background:#00a8d8}
video{width:100%;background:black;border-radius:10px;max-height:430px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.channel{background:#192943;padding:12px;border-radius:10px;cursor:pointer;text-align:center;min-width:0}
.channel:hover{outline:1px solid #00caff}
.channel img{width:45px;height:45px;object-fit:contain}
.channel p{font-size:13px;overflow-wrap:anywhere}
.channel small{color:#aabbd0}
.status{font-size:13px;color:#00dfa4;margin-top:10px}
.hidden{display:none}
footer{text-align:center;color:#78879e;padding:20px;font-size:12px}
</style>
</head>

<body>

<header>
  <div class="logo">MAX IPTV</div>
  <small>PLAYER • TV AO VIVO</small>
</header>

<main>

<section class="panel">
<h2>Conectar sua assinatura</h2>

<div class="tabs">
<button id="tabM3u" class="active" onclick="showTab('m3u')">Lista M3U</button>
<button id="tabXtream" onclick="showTab('xtream')">Login IPTV</button>
</div>

<div id="m3u">
<h3>Endereços M3U</h3>
<input id="url1" placeholder="Link M3U 1"
value="http://e.servipbr.com/ShLa6UGbn">
<input id="url2" placeholder="Link M3U 2"
value="http://e.servipbr.com/SXptF4anu">
<input id="url3" placeholder="Link SSIPTV"
value="http://e.servipbr.com/SUekiQRA3">

<button onclick="loadAllM3U()">CARREGAR AS LISTAS</button>

<h3>Ou importar arquivo</h3>
<input type="file" id="file" accept=".m3u,.m3u8,.txt">
<button class="secondary" onclick="loadFile()">IMPORTAR ARQUIVO</button>
</div>

<div id="xtream" class="hidden">
<h3>Dados da assinatura</h3>
<input id="server" value="https://servipbr.com"
placeholder="Servidor / DNS">
<input id="username" placeholder="Login">
<input id="password" type="password" placeholder="Senha">
<button onclick="connectXtream()">CONECTAR E CARREGAR CANAIS</button>
</div>

<p id="status" class="status">Aguardando conexão...</p>
</section>

<section class="panel">
<h2>Reprodutor</h2>
<video id="player" controls playsinline></video>
<p id="playing">Selecione um canal para assistir.</p>
</section>

<section class="panel">
<h2>Programação</h2>
<input id="search" placeholder="Pesquisar canal..."
oninput="renderChannels()">

<div class="categories" id="categories"></div>
<div id="channels" class="grid">
<p>Conecte sua lista para visualizar os canais.</p>
</div>
</section>

</main>

<footer>MAX IPTV PLAYER © 2026</footer>

<script>
let channels=[];
let category="Todos";
let favorites=new Set();
let hls=null;

const player=document.getElementById("player");

function status(message){
 document.getElementById("status").textContent=message;
}

function showTab(tab){
 document.getElementById("m3u").classList.toggle("hidden",tab!=="m3u");
 document.getElementById("xtream").classList.toggle("hidden",tab!=="xtream");
 document.getElementById("tabM3u").classList.toggle("active",tab==="m3u");
 document.getElementById("tabXtream").classList.toggle("active",tab==="xtream");
}

function validURL(value){
 try{
  const u=new URL(value);
  return ["http:","https:"].includes(u.protocol)?u.href:null;
 }catch{return null}
}

function parseM3U(text){
 const lines=text.split(/\r?\n/);
 const result=[];
 let current=null;

 for(const original of lines){
  const line=original.trim();
  if(!line)continue;

  if(line.startsWith("#EXTINF:")){
   const name=line.split(",").slice(1).join(",").trim();
   const group=line.match(/group-title="([^"]*)"/i);
   const logo=line.match(/tvg-logo="([^"]*)"/i);
   current={
    name:name||"Canal sem nome",
    group:group?group[1]:"Outros",
    logo:logo?validURL(logo[1]):null,
    url:null
   };
  }
  else if(!line.startsWith("#")&&current){
   const url=validURL(line);
   if(url){
    current.url=url;
    result.push(current);
   }
   current=null;
  }
 }
 return result;
}

function mergeChannels(items){
 const seen=new Set(channels.map(c=>c.url));
 let added=0;

 for(const item of items){
  if(!item.url||seen.has(item.url))continue;
  seen.add(item.url);
  channels.push(item);
  added++;
 }

 renderCategories();
 renderChannels();
 return added;
}

async function fetchPlaylist(url){
 const response=await fetch(url);
 if(!response.ok)throw new Error("HTTP "+response.status);
 return parseM3U(await response.text());
}

async function loadAllM3U(){
 const urls=["url1","url2","url3"]
  .map(id=>document.getElementById(id).value.trim())
  .filter(Boolean);

 if(!urls.length){
  status("Informe pelo menos um endereço.");
  return;
 }

 channels=[];
 status("Carregando listas...");

 let failures=0;

 for(let i=0;i<urls.length;i++){
  const url=validURL(urls[i]);

  if(!url){failures++;continue;}

  try{
   const items=await fetchPlaylist(url);
   mergeChannels(items);
  }catch(error){
   failures++;
   console.error(error);
  }
 }

 if(channels.length){
  status(channels.length+" canais carregados. "+
   failures+" lista(s) não acessíveis.");
 }else{
  status("Não foi possível carregar. Verifique o servidor ou CORS.");
 }
}

function loadFile(){
 const file=document.getElementById("file").files[0];
 if(!file)return alert("Escolha um arquivo M3U.");

 const reader=new FileReader();

 reader.onload=()=>{
  channels=[];
  const items=parseM3U(reader.result);
  mergeChannels(items);
  status(channels.length+" canais importados.");
 };

 reader.readAsText(file);
}

async function connectXtream(){
 const serverInput=document.getElementById("server").value.trim();
 const user=document.getElementById("username").value.trim();
 const pass=document.getElementById("password").value;

 const server=validURL(serverInput)?.replace(/\/+$/,"");

 if(!server||!user||!pass){
  status("Preencha servidor, login e senha.");
  return;
 }

 status("Verificando acesso IPTV...");

 try{
  const api=new URL(server+"/player_api.php");
  api.searchParams.set("username",user);
  api.searchParams.set("password",pass);

  const response=await fetch(api);
  if(!response.ok)throw new Error("Erro HTTP "+response.status);

  const auth=await response.json();

  if(!auth.user_info ||
     auth.user_info.auth!==1){
   throw new Error("Login não autorizado.");
  }

  status("Acesso confirmado. Carregando canais...");

  api.searchParams.set("action","get_live_streams");

  const streamResponse=await fetch(api);
  if(!streamResponse.ok)throw new Error("Erro ao buscar canais.");

  const streams=await streamResponse.json();

  if(!Array.isArray(streams)){
   throw new Error("Resposta de canais inválida.");
  }

  const base=server.replace(/\/+$/,"");

  channels=streams.map(s=>{
   const ext=s.container_extension||"ts";
   return {
    name:s.name||"Canal",
    group:s.category_name||"TV ao vivo",
    logo:validURL(s.stream_icon||""),
    url:base+"/live/"+
      encodeURIComponent(user)+"/"+
      encodeURIComponent(pass)+"/"+
      encodeURIComponent(s.stream_id)+"."+ext
   };
  });

  renderCategories();
  renderChannels();

  status(channels.length+" canais carregados com sucesso.");

 }catch(error){
  console.error(error);
  status("Falha na conexão: "+error.message+
   ". O servidor pode exigir suporte a CORS.");
 }
}

function renderCategories(){
 const box=document.getElementById("categories");
 box.replaceChildren();

 const groups=["Todos","Favoritos",
  ...new Set(channels.map(c=>c.group))];

 groups.forEach(group=>{
  const b=document.createElement("button");
  b.textContent=group;
  b.className=category===group?"active":"";
  b.onclick=()=>{
   category=group;
   renderCategories();
   renderChannels();
  };
  box.appendChild(b);
 });
}

function renderChannels(){
 const box=document.getElementById("channels");
 box.replaceChildren();

 const search=document.getElementById("search")
  .value.toLowerCase();

 const filtered=channels.filter(c=>{
  const nameMatch=c.name.toLowerCase().includes(search);
  const groupMatch=category==="Todos"||
   (category==="Favoritos"
    ?favorites.has(c.url)
    :c.group===category);
  return nameMatch&&groupMatch;
 });

 if(!filtered.length){
  box.textContent="Nenhum canal encontrado.";
  return;
 }

 filtered.forEach(c=>{
  const card=document.createElement("div");
  card.className="channel";

  if(c.logo){
   const img=document.createElement("img");
   img.src=c.logo;
   img.alt="";
   img.onerror=()=>img.remove();
   card.appendChild(img);
  }

  const name=document.createElement("p");
  name.textContent=c.name;
  card.appendChild(name);

  const group=document.createElement("small");
  group.textContent=c.group;
  card.appendChild(group);

  const fav=document.createElement("button");
  fav.className="secondary";
  fav.textContent=favorites.has(c.url)?"★":"☆";
  fav.onclick=e=>{
   e.stopPropagation();
   if(favorites.has(c.url))favorites.delete(c.url);
   else favorites.add(c.url);
   renderChannels();
  };
  card.appendChild(fav);

  card.onclick=()=>playChannel(c);
  box.appendChild(card);
 });
}

function playChannel(channel){
 const url=validURL(channel.url);
 if(!url)return;

 if(hls){
  hls.destroy();
  hls=null;
 }

 player.pause();
 player.removeAttribute("src");
 player.load();

 document.getElementById("playing").textContent=
  "Reproduzindo: "+channel.name;

 if(url.toLowerCase().includes(".m3u8")&&
    window.Hls&&Hls.isSupported()){
  hls=new Hls();
  hls.loadSource(url);
  hls.attachMedia(player);

  hls.on(Hls.Events.MANIFEST_PARSED,()=>{
   player.play().catch(()=>{});
  });

  hls.on(Hls.Events.ERROR,(event,data)=>{
   if(data.fatal){
    document.getElementById("playing").textContent=
     "Erro na reprodução deste canal.";
   }
  });

 }else{
  player.src=url;
  player.play().catch(()=>{
   document.getElementById("playing").textContent=
    "Formato incompatível ou acesso não autorizado.";
  });
 }
}
</script>

</body>
</html>
